    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getCurrentMonthKey() {
      return getTodayISO().slice(0, 7);
    }

    function formatMonthLabel(monthKey) {
      if (!monthKey || !/^\d{4}-\d{2}$/.test(monthKey)) return 'Todos los meses';
      const [year, month] = monthKey.split('-').map(Number);
      const dt = new Date(year, month - 1, 1);
      const raw = dt.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
      return raw.charAt(0).toUpperCase() + raw.slice(1);
    }

    // Cargar o inicializar estado
    let state = loadState();
    let isRemoteApplying = false;

    function loadDeviceSession() {
      try {
        const raw = localStorage.getItem(DEVICE_SESSION_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            currentUserId: parsed.currentUserId || null,
            activeTab: parsed.activeTab || 'ordenes'
          };
        }
      } catch (e) {
        console.warn('No se pudo leer la sesión local del dispositivo.', e);
      }
      return { currentUserId: null, activeTab: 'ordenes' };
    }

    function saveDeviceSession() {
      try {
        localStorage.setItem(DEVICE_SESSION_KEY, JSON.stringify({
          currentUserId: state.currentUserId,
          activeTab: state.activeTab
        }));
      } catch (e) {
        console.warn('No se pudo guardar la sesión local del dispositivo.', e);
      }
    }

    function getSharedStatePayload(srcState = state) {
      return {
        users: srcState.users || [],
        garments: srcState.garments || [],
        orders: srcState.orders || [],
        financeQueue: srcState.financeQueue || [],
        payoutHistory: srcState.payoutHistory || []
      };
    }

    function loadState() {
      const deviceSession = loadDeviceSession();
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed.financeQueue)) parsed.financeQueue = [];
          return {
            ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
            ...parsed,
            currentUserId: deviceSession.currentUserId,
            activeTab: deviceSession.activeTab
          };
        }
      } catch (e) {
        console.warn('No se pudo leer localStorage, usando estado inicial.', e);
      }
      const base = JSON.parse(JSON.stringify(DEFAULT_STATE));
      base.currentUserId = deviceSession.currentUserId;
      base.activeTab = deviceSession.activeTab;
      return base;
    }

    function saveState() {
      saveDeviceSession();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showToast('Aviso: Almacenamiento local lleno por imágenes pesadas.', 'error');
      }
      if (!isRemoteApplying && typeof window.pushSharedStateToFirebase === 'function') {
        window.pushSharedStateToFirebase(getSharedStatePayload(state));
      }
    }

    function resetDemoData() {
      localStorage.removeItem(STORAGE_KEY);
      const currentSession = { currentUserId: state.currentUserId, activeTab: state.activeTab };
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      state.currentUserId = currentSession.currentUserId;
      state.activeTab = currentSession.activeTab;
      saveState();
      render();
      showToast('Datos de demostración restaurados y sincronizados.', 'success');
    }

    }

    function getRoleLabel(rol) {
      if (rol === 'admin') return 'Administración / Calidad';
      if (rol === 'finanzas') return 'Finanzas';
      if (rol === 'cortador') return 'Cortador / Cortadora';
      if (rol === 'costurero') return 'Costurero / Costurera';
      return rol;
    }

    function getPaySchemeLabel(user) {
      if (!user) return '';
      if (user.esquemaPago === 'pieza') return 'Por pieza (Destajo)';
      if (user.esquemaPago === 'sueldo_comision') {
        const sueldoTxt = user.sueldoBase ? `Sueldo ${formatMXN(user.sueldoBase)} + ` : 'Sueldo + ';
        return `${sueldoTxt}Comisión (Meta ${user.metaSemanal || 0} pzas)`;
      }
      return user.sueldoBase ? `Sueldo fijo (${formatMXN(user.sueldoBase)})` : 'Sueldo fijo';
    }

    function getEffectiveUnitRate(order, stage, worker) {
      const baseSnapshot = stage === 'corte' ? order.tarifaCorteSnapshot : order.tarifaCosturaSnapshot;
      if (worker && worker.esquemaPago === 'sueldo_comision' && worker.tipoTarifaComision === 'fija' && worker.tarifaComisionFija > 0) {
        return worker.tarifaComisionFija;
      }
      return baseSnapshot;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      const styles = type === 'error'
        ? 'bg-red-950/95 border-red-700 text-red-100'
        : type === 'warning'
        ? 'bg-amber-950/95 border-amber-700 text-amber-100'
        : 'bg-emerald-950/95 border-emerald-700 text-emerald-100';
      const icon = type === 'error'
        ? 'fa-circle-exclamation text-red-400'
        : type === 'warning'
        ? 'fa-triangle-exclamation text-amber-400'
        : 'fa-circle-check text-emerald-400';

      el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-2xl text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${styles}`;
      el.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;
      container.appendChild(el);

      requestAnimationFrame(() => {
        el.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 3400);
    }

    // Lectura y compresión ligera de imágenes subidas desde galería/cámara
    function handleImageFile(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const MAX_DIM = 850;
          let width = img.width;
          let height = img.height;
          if (width > height && width > MAX_DIM) {
            height *= MAX_DIM / width;
            width = MAX_DIM;
          } else if (height > MAX_DIM) {
            width *= MAX_DIM / height;
            height = MAX_DIM;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ============================================================================
    // CÁLCULO DE PAGOS Y COMISIONES ACUMULADAS POR TRABAJADOR
    // ============================================================================
    function calculateWorkerEarnings(workerId) {
      const worker = getUserById(workerId);
      if (!worker || worker.esquemaPago === 'sueldo') {
        return {
          approvedAmount: 0,
          approvedPieces: 0,
          baseSalaryPieces: 0,
          commissionPieces: 0,
          pendingAmount: 0,
          pendingPieces: 0,
          totalWeekApprovedPieces: 0,
          quota: 0,
          items: []
        };
      }

      const isHybrid = worker.esquemaPago === 'sueldo_comision';
      const quota = isHybrid ? (Number(worker.metaSemanal) || 0) : 0;

      let approvedAmount = 0;
      let approvedPieces = 0;
      let baseSalaryPieces = 0;
      let commissionPieces = 0;
      let pendingAmount = 0;
      let pendingPieces = 0;
      const items = [];

      state.orders.forEach(order => {
        const garment = getGarmentById(order.garmentId);
        const garmentName = garment ? garment.nombre : 'Prenda';

        // Evaluar etapa de Corte
        if (order.cortadorId === workerId && order.estadoCorte !== 'no_aplica') {
          const unitRate = getEffectiveUnitRate(order, 'corte', worker);
          const subtotal = order.cantidad * unitRate;
          const isCommissionMarked = !isHybrid || Boolean(order.comisionCorte);
          const sentToFinance = Boolean(order.enviadoFinanzasCorte || order.pagadoCorte);

          // Solo se suma oficialmente a su pago / sueldo / comisiones cuando es APROBADO por Calidad
          if (order.estadoCorte === 'aprobado' && !order.pagadoCorte && !sentToFinance) {
            approvedPieces += order.cantidad;
            if (isCommissionMarked) {
              approvedAmount += subtotal;
              commissionPieces += order.cantidad;
            } else {
              baseSalaryPieces += order.cantidad;
            }
            items.push({
              orderId: order.id,
              stage: 'corte',
              folio: order.folio,
              prenda: garmentName,
              etapa: 'Corte',
              cantidad: order.cantidad,
              tarifa: unitRate,
              subtotal: isCommissionMarked ? subtotal : 0,
              rawSubtotal: subtotal,
              cuentaComision: isCommissionMarked,
              estado: order.estadoCorte,
              fecha: order.fechaAprobadoCalidad || order.fechaCorteTerminado || order.fechaCreacion
            });
          } else if (order.estadoCorte === 'en_calidad' && !order.pagadoCorte && !sentToFinance) {
            pendingPieces += order.cantidad;
            if (isCommissionMarked) {
              pendingAmount += subtotal;
            }
          }
        }

        // Evaluar etapa de Costura
        if (order.costureroId === workerId && order.estadoCostura !== 'no_aplica') {
          const unitRate = getEffectiveUnitRate(order, 'costura', worker);
          const subtotal = order.cantidad * unitRate;
          const isCommissionMarked = !isHybrid || Boolean(order.comisionCostura);
          const sentToFinance = Boolean(order.enviadoFinanzasCostura || order.pagadoCostura);

          // Solo se suma oficialmente a su pago / sueldo / comisiones cuando es APROBADO por Calidad
          if (order.estadoCostura === 'aprobado' && !order.pagadoCostura && !sentToFinance) {
            approvedPieces += order.cantidad;
            if (isCommissionMarked) {
              approvedAmount += subtotal;
              commissionPieces += order.cantidad;
            } else {
              baseSalaryPieces += order.cantidad;
            }
            items.push({
              orderId: order.id,
              stage: 'costura',
              folio: order.folio,
              prenda: garmentName,
              etapa: 'Costura',
              cantidad: order.cantidad,
              tarifa: unitRate,
              subtotal: isCommissionMarked ? subtotal : 0,
              rawSubtotal: subtotal,
              cuentaComision: isCommissionMarked,
              estado: order.estadoCostura,
              fecha: order.fechaAprobadoCalidad || order.fechaCosturaTerminado || order.fechaCreacion
            });
          } else if (order.estadoCostura === 'en_calidad' && !order.pagadoCostura && !sentToFinance) {
            pendingPieces += order.cantidad;
            if (isCommissionMarked) {
              pendingAmount += subtotal;
            }
          }
        }
      });

      const baseSalary = Number(worker.sueldoBase) || 0;
      const totalPayoutEstimate = isHybrid ? baseSalary + approvedAmount : approvedAmount;

      return {
        approvedAmount,
        baseSalary,
        totalPayoutEstimate,
        approvedPieces,
        baseSalaryPieces,
        commissionPieces,
        pendingAmount,
        pendingPieces,
        totalWeekApprovedPieces: approvedPieces,
        quota,
        items
      };
    }

    // ============================================================================

    // Cortador marca que terminó el corte:
    // Si es secuencial va directo a Costura; si es solo corte va a Calidad.
    function completeCutStage(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;

      const stamp = formatNowStamp();
      order.fechaCorteTerminado = stamp;
      order.devolucion = null;

      if (order.flujo === 'secuencial') {
        order.estadoCorte = 'aprobado';
        if (order.estadoCostura === 'bloqueado_corte' || order.estadoCostura === 'devuelto') {
          order.estadoCostura = 'pendiente';
        }
        order.estadoGeneral = 'en_proceso';
        showToast(`Folio ${order.folio}: ¡Corte listo (${stamp})! Pasó directo a Costura.`);
      } else {
        order.estadoCorte = 'en_calidad';
        order.estadoGeneral = 'revision_calidad';
        showToast(`Folio ${order.folio}: Corte terminado (${stamp}) y enviado a revisión de Calidad.`);
      }

      saveState();
      render();
    }

    // Costurero marca que terminó la costura -> pasa directo a Calidad
    function completeSewingStage(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;

      const stamp = formatNowStamp();
      order.estadoCostura = 'en_calidad';
      order.estadoGeneral = 'revision_calidad';
      order.fechaCosturaTerminado = stamp;
      order.devolucion = null;

      saveState();
      render();
      showToast(`Folio ${order.folio}: ¡Costura terminada (${stamp})! Enviado a revisión de Calidad.`);
    }

    // Administración / Calidad aprueba una etapa o la orden completa
    function approveStage(orderId, stage, forceCommissionFlag = null) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;

      const checkboxEl = document.getElementById(`comm-check-${orderId}-${stage}`);
      const countAsCommission = forceCommissionFlag !== null
        ? Boolean(forceCommissionFlag)
        : (checkboxEl ? checkboxEl.checked : false);

      if (stage === 'corte') {
        order.estadoCorte = 'aprobado';
        order.comisionCorte = countAsCommission;
        if (!order.fechaCorteTerminado) order.fechaCorteTerminado = formatNowStamp();
        if (order.flujo === 'secuencial' && order.estadoCostura === 'bloqueado_corte') {
          order.estadoCostura = 'pendiente';
        }
      } else if (stage === 'costura') {
        order.estadoCostura = 'aprobado';
        order.comisionCostura = countAsCommission;
        if (!order.fechaCosturaTerminado) order.fechaCosturaTerminado = formatNowStamp();
      }

      // Verificar si todas las etapas aplicables ya están aprobadas
      const corteOk = order.estadoCorte === 'no_aplica' || order.estadoCorte === 'aprobado';
      const costuraOk = order.estadoCostura === 'no_aplica' || order.estadoCostura === 'aprobado';

      if (corteOk && costuraOk) {
        order.estadoGeneral = 'completado';
        order.fechaAprobadoCalidad = formatNowStamp();
      } else if (order.estadoCorte === 'en_calidad' || order.estadoCostura === 'en_calidad') {
        order.estadoGeneral = 'revision_calidad';
      } else {
        order.estadoGeneral = 'en_proceso';
      }

      saveState();
      render();
      const extraMsg = countAsCommission ? ' (Marcada como COMISIÓN)' : '';
      showToast(`Etapa de ${stage.toUpperCase()} aprobada en ${order.folio}${extraMsg}.`);
    }

    // Alternar en tiempo real si un lote ya aprobado cuenta como Base Sueldo o Comisión
    function toggleOrderCommissionFlag(orderId, stage) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;

      if (stage === 'corte') {
        order.comisionCorte = !order.comisionCorte;
      } else {
        order.comisionCostura = !order.comisionCostura;
      }

      saveState();
      render();
      const active = stage === 'corte' ? order.comisionCorte : order.comisionCostura;
      showToast(
        active
          ? `${order.folio} (${stage}): Ahora cuenta como COMISIÓN.`
          : `${order.folio} (${stage}): Cambiado a cobertura de SUELDO BASE.`,
        'success'
      );
    }

    function submitRejection(e) {
      e.preventDefault();
      const order = state.orders.find(o => o.id === rejectionDraft.orderId);

      showToast(`Orden ${order.folio} devuelta a ${stage.toUpperCase()} con observaciones.`, 'warning');

      render();
      showToast('Prenda eliminada del catálogo.');
    }

    // ============================================================================
    // GESTIÓN DE EMPLEADOS / USUARIOS SIN CORREO (ADMIN)
    // ============================================================================
    function toggleNewEmployeeSchemeFields() {
      const role = document.getElementById('empRoleSelect').value;
      const schemeWrap = document.getElementById('empSchemeWrap');
      const salaryWrap = document.getElementById('empSalaryWrap');
      const hybridWrap = document.getElementById('empHybridConfigWrap');

      if (role === 'admin' || role === 'finanzas') {
        if (schemeWrap) schemeWrap.classList.add('hidden');
        if (salaryWrap) salaryWrap.classList.add('hidden');
        if (hybridWrap) hybridWrap.classList.add('hidden');
        return;
      }
      if (schemeWrap) schemeWrap.classList.remove('hidden');

      const schemeSelect = document.getElementById('empPaySchemeSelect');
      const scheme = schemeSelect ? schemeSelect.value : 'pieza';

      if (salaryWrap) {
        if (scheme === 'sueldo' || scheme === 'sueldo_comision') {
          salaryWrap.classList.remove('hidden');
        } else {
          salaryWrap.classList.add('hidden');
        }
      }

      if (hybridWrap) {
        if (scheme === 'sueldo_comision') {
          hybridWrap.classList.remove('hidden');
        } else {
          hybridWrap.classList.add('hidden');
        }
      }
    }

    function toggleNewEmployeeCommRateInput() {
      const rateTypeSelect = document.getElementById('empCommRateTypeSelect');
      const fixedWrap = document.getElementById('empFixedCommRateWrap');
      if (!rateTypeSelect || !fixedWrap) return;
      if (rateTypeSelect.value === 'fija') {
        fixedWrap.classList.remove('hidden');
      } else {
        fixedWrap.classList.add('hidden');
      }
    }

    function createEmployeeUser(e) {
      if (e && e.preventDefault) e.preventDefault();
      const nombre = document.getElementById('empNameInput').value.trim();
      const usuario = document.getElementById('empUserInput').value.trim().toLowerCase().replace(/\s+/g, '');
      const password = document.getElementById('empPassInput').value.trim();
      const rol = document.getElementById('empRoleSelect').value;
      const esquemaPago = (rol === 'admin' || rol === 'finanzas') ? 'sueldo' : document.getElementById('empPaySchemeSelect').value;
      const sueldoBaseInput = document.getElementById('empSalaryInput');
      const sueldoBase = (esquemaPago === 'sueldo' || esquemaPago === 'sueldo_comision') && sueldoBaseInput
        ? (parseFloat(sueldoBaseInput.value) || 0)
        : 0;
      const metaSemanal = esquemaPago === 'sueldo_comision'
        ? (parseInt(document.getElementById('empQuotaInput').value, 10) || 25)
        : 0;
      const tipoTarifaComision = esquemaPago === 'sueldo_comision'
        ? document.getElementById('empCommRateTypeSelect').value
        : 'prenda';
      const tarifaComisionFija = (esquemaPago === 'sueldo_comision' && tipoTarifaComision === 'fija')
        ? (parseFloat(document.getElementById('empFixedCommRateInput').value) || 0)
        : 0;

      if (!nombre || !usuario || !password) {
        showToast('Completa nombre, usuario y contraseña.', 'error');
        return;
      }

      if (state.users.some(u => u.usuario.toLowerCase() === usuario)) {
        showToast('Ese nombre de usuario ya existe. Elige otro.', 'error');
        return;
      }

      state.users.push({
        id: 'u-' + Date.now(),
        nombre,
        usuario,
        password,
        rol,
        esquemaPago,
        sueldoBase,
        metaSemanal,
        tipoTarifaComision,
        tarifaComisionFija,
        activo: true
      });

      document.getElementById('empNameInput').value = '';
      document.getElementById('empUserInput').value = '';
      document.getElementById('empPassInput').value = '';

      saveState();
      render();
      showToast(`Usuario "${usuario}" creado con esquema ${getPaySchemeLabel(state.users[state.users.length - 1])}.`);
    }

    function updateWorkerSalary(userId, newSalary) {
      const user = getUserById(userId);
      if (!user) return;
      const val = parseFloat(newSalary);
      if (!isNaN(val) && val >= 0) {
        user.sueldoBase = val;
        saveState();
        render();
        showToast(`Sueldo base de ${user.nombre} actualizado a ${formatMXN(val)}.`);
      }
    }

    function cycleWorkerPayScheme(userId) {
      const user = getUserById(userId);
      if (!user || user.rol === 'admin') return;
      const order = ['pieza', 'sueldo', 'sueldo_comision'];
      const nextIdx = (order.indexOf(user.esquemaPago) + 1) % order.length;
      user.esquemaPago = order[nextIdx];
      if (user.esquemaPago === 'sueldo_comision' && (!user.metaSemanal || user.metaSemanal <= 0)) {
        user.metaSemanal = 25;
      }
      saveState();
      render();
      showToast(`Esquema de ${user.nombre} actualizado a: ${getPaySchemeLabel(user)}.`);
    }

    function updateWorkerQuota(userId, newQuota) {
      const user = getUserById(userId);
      if (!user) return;
      const val = parseInt(newQuota, 10);
      if (!isNaN(val) && val >= 0) {
        user.metaSemanal = val;
        saveState();
        render();
        showToast(`Meta semanal de ${user.nombre} ajustada a ${val} piezas.`);
      }
    }

    // Dar de baja o reactivar acceso de un usuario
    function toggleUserActiveStatus(userId) {
      const user = getUserById(userId);
      if (!user) return;
      if (user.id === state.currentUserId) {
        showToast('No puedes dar de baja tu propia sesión activa.', 'warning');
        return;
      }
      user.activo = user.activo === false ? true : false;
      saveState();
      render();
      if (user.activo) {
        showToast(`Acceso reactivado para ${user.nombre} (@${user.usuario}).`, 'success');
      } else {
        showToast(`Usuario ${user.nombre} (@${user.usuario}) dado de baja. Ya no podrá ingresar.`, 'warning');
      }
    }

    // ============================================================================
    // ENVÍO A FINANZAS Y CONFIRMACIÓN DE PAGO
    // ============================================================================
    // Administración marca el corte/sueldo y lo envía directamente a Finanzas
    function sendWorkerPayoutToFinance(workerId) {
      const adminUser = getCurrentUser();
      const worker = getUserById(workerId);
      if (!worker) return;
      const calc = calculateWorkerEarnings(workerId);
      const isHybrid = worker.esquemaPago === 'sueldo_comision';
      const isSalaryOnly = worker.esquemaPago === 'sueldo';
      const sueldoBase = Number(worker.sueldoBase) || 0;
      const totalToPay = isSalaryOnly
        ? sueldoBase
        : isHybrid
        ? sueldoBase + calc.approvedAmount
        : calc.approvedAmount;

      if (totalToPay <= 0 && calc.approvedPieces <= 0) {
        showToast('Este trabajador no tiene monto o piezas aprobadas pendientes de enviar.', 'warning');
        return;
      }

      const coveredOrderIds = [];
      state.orders.forEach(order => {
        if (order.cortadorId === workerId && order.estadoCorte === 'aprobado' && !order.pagadoCorte && !order.enviadoFinanzasCorte) {
          order.enviadoFinanzasCorte = true;
          coveredOrderIds.push({ orderId: order.id, stage: 'corte' });
        }
        if (order.costureroId === workerId && order.estadoCostura === 'aprobado' && !order.pagadoCostura && !order.enviadoFinanzasCostura) {
          order.enviadoFinanzasCostura = true;
          coveredOrderIds.push({ orderId: order.id, stage: 'costura' });
        }
      });

      const concepto = isSalaryOnly
        ? `Sueldo fijo (${formatMXN(sueldoBase)})`
        : isHybrid
        ? `Sueldo base (${formatMXN(sueldoBase)}) + Comisiones (${formatMXN(calc.approvedAmount)} • ${calc.commissionPieces} pzas comisión / ${calc.baseSalaryPieces} pzas base)`
        : 'Destajo por pieza';

      state.financeQueue.unshift({
        id: 'FIN-' + Date.now(),
        workerId: worker.id,
        workerName: worker.nombre,
        rol: getRoleLabel(worker.rol),
        piezas: calc.approvedPieces,
        sueldoBase: (isSalaryOnly || isHybrid) ? sueldoBase : 0,
        comisiones: isSalaryOnly ? 0 : calc.approvedAmount,
        monto: totalToPay,
        concepto,
        enviadoPor: adminUser ? adminUser.nombre : 'Administración',
        fechaEnvio: formatNowStamp(),
        coveredOrderIds
      });

      saveState();
      render();
      showToast(`Envío de ${formatMXN(totalToPay)} para ${worker.nombre} registrado en Finanzas.`);
    }

    // Finanzas revisa el monto enviado por Administración y lo marca como PAGADO
    function confirmFinancePayment(financeItemId) {
      const financeUser = getCurrentUser();
      const idx = state.financeQueue.findIndex(item => item.id === financeItemId);
      if (idx === -1) return;

      const item = state.financeQueue[idx];

      // Marcar las órdenes cubiertas como definitivamente pagadas
      (item.coveredOrderIds || []).forEach(ref => {
        const order = state.orders.find(o => o.id === ref.orderId);
        if (!order) return;
        if (ref.stage === 'corte') {
          order.pagadoCorte = true;
        } else if (ref.stage === 'costura') {
          order.pagadoCostura = true;
        }
      });

      state.payoutHistory.unshift({
        id: 'PAY-' + Date.now(),
        workerId: item.workerId,
        workerName: item.workerName,
        rol: item.rol,
        piezas: item.piezas,
        sueldoBase: item.sueldoBase || 0,
        comisiones: item.comisiones || 0,
        monto: item.monto,
        concepto: item.concepto,
        fecha: `${formatNowStamp()} (Pagado por Finanzas)`,
        fechaISO: getTodayISO(),
        mesClave: getTodayISO().slice(0, 7),
        enviadoPor: item.enviadoPor,
        pagadoPor: financeUser ? financeUser.nombre : 'Finanzas'
      });

      state.financeQueue.splice(idx, 1);

      saveState();
      render();
      showToast(`Pago de ${formatMXN(item.monto)} a ${item.workerName} marcado como PAGADO por Finanzas.`);
    }

    // ============================================================================
    // RENDERIZADO DE PANTALLAS Y COMPONENTES
    // ============================================================================
    function renderWorkerDashboard(worker) {
      const isCutter = worker.rol === 'cortador';
      const isPieceRate = worker.esquemaPago === 'pieza';
      const isHybrid = worker.esquemaPago === 'sueldo_comision';
      const earnings = calculateWorkerEarnings(worker.id);
      const myOrders = state.orders.filter(o => {
        const matchesWorker = isCutter ? o.cortadorId === worker.id : o.costureroId === worker.id;
        if (!matchesWorker) return false;
        const myStageStatus = isCutter ? o.estadoCorte : o.estadoCostura;
        // Permanece en Mis Órdenes Asignadas hasta que Calidad la marque como 'aprobado'
        return myStageStatus !== 'aprobado' && myStageStatus !== 'no_aplica';
      });

      if (state.activeTab === 'mi_pago' && (isPieceRate || isHybrid)) {
        return renderWorkerEarningsTab(worker, earnings);
      }

      const returnedCount = myOrders.filter(o =>
        (isCutter ? o.estadoCorte : o.estadoCostura) === 'devuelto'
      ).length;

      const pct = isHybrid && earnings.quota > 0
        ? Math.min(100, Math.round((earnings.totalWeekApprovedPieces / earnings.quota) * 100))
        : 0;

      return `
        <!-- Banner superior del trabajador según esquema de pago -->
        ${isPieceRate ? `
          <div class="bg-gradient-to-r from-emerald-950/60 via-zinc-900 to-zinc-900 border border-emerald-500/30 rounded-2xl p-4 sm:p-5 mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-300">Acumulado actual aprobado (Por pieza)</span>
              <div class="text-2xl sm:text-3xl font-extrabold text-white font-mono-num mt-0.5">${formatMXN(earnings.approvedAmount)}</div>
              <p class="text-xs text-zinc-400 mt-0.5">${earnings.approvedPieces} piezas aprobadas • ${earnings.pendingPieces} en revisión de calidad</p>
            </div>
            <button onclick="setTab('mi_pago')" class="px-4 py-2.5 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-200 border border-emerald-500/40 text-xs font-bold self-start sm:self-center transition">
              Ver desglose de pago →
            </button>
          </div>
        ` : isHybrid ? `
          <div class="bg-gradient-to-r from-purple-950/60 via-zinc-900 to-zinc-900 border border-purple-500/35 rounded-2xl p-4 sm:p-5 mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-[11px] font-bold uppercase tracking-wider text-purple-300">Esquema Sueldo Fijo + Comisión</span>
                <span class="text-xs font-mono-num text-zinc-300">${earnings.totalWeekApprovedPieces} / ${earnings.quota} pzas meta</span>
              </div>
              <div class="text-2xl sm:text-3xl font-extrabold text-white font-mono-num mt-1">
                ${formatMXN(earnings.approvedAmount)} <span class="text-xs font-semibold text-purple-300">en comisiones</span>
              </div>
              <div class="w-full max-w-md h-2 bg-zinc-800 rounded-full overflow-hidden mt-2">
                <div class="h-full bg-purple-500 rounded-full transition-all" style="width: ${pct}%"></div>
              </div>
            </div>
            <button onclick="setTab('mi_pago')" class="px-4 py-2.5 rounded-xl bg-purple-500/20 hover:bg-purple-500/30 text-purple-200 border border-purple-500/40 text-xs font-bold self-start sm:self-center transition">
              Ver meta y comisiones →
            </button>
          </div>
        ` : `
          <div class="bg-zinc-900/80 border border-sky-500/25 rounded-2xl p-4 mb-6 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-sky-500/15 text-sky-300 flex items-center justify-center">
                <i class="fa-solid fa-briefcase"></i>
              </div>
              <div>
                <div class="text-sm font-bold text-white">Modalidad: Sueldo Fijo (${earnings.approvedPieces} pzas aprobadas en calidad)</div>
                <div class="text-xs text-zinc-400">Las piezas salen de tus órdenes asignadas y cuentan para tu sueldo al ser aprobadas por Calidad.</div>
              </div>
            </div>
          </div>
        `}

        ${returnedCount > 0 ? `
          <div class="mb-5 p-4 rounded-2xl bg-red-950/60 border border-red-500/50 flex items-center gap-3 text-red-200 text-xs sm:text-sm">
            <i class="fa-solid fa-circle-exclamation text-red-400 text-xl shrink-0"></i>
            <div>
              <strong>Tienes ${returnedCount} ${returnedCount === 1 ? 'orden devuelta' : 'órdenes devueltas'} por Calidad.</strong> Revisa el motivo y la foto adjunta para corregirla.
            </div>
          </div>
        ` : ''}

          <div class="mb-4 flex items-center justify-between">
          <div>
            <h2 class="text-lg font-bold text-white">Mis Órdenes Asignadas</h2>
            <p class="text-xs text-zinc-400">Se mantienen aquí hasta ser aprobadas por Calidad; al aprobarse pasan a tu pago/sueldo/comisión.</p>
          </div>
          <span class="text-xs font-mono-num text-zinc-400">${myOrders.length} asignaciones</span>
        </div>

        ${myOrders.length === 0 ? `
          <div class="bg-zinc-900/70 border border-zinc-800 rounded-2xl p-12 text-center text-zinc-500">
            No tienes órdenes asignadas por el momento.

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    }

    function renderWorkerOrderCard(order, worker, earnings) {
      const isCutter = worker.rol === 'cortador';
      const isPieceRate = worker.esquemaPago === 'pieza';
      const isHybrid = worker.esquemaPago === 'sueldo_comision';
      const garment = getGarmentById(order.garmentId);
      const myStatus = isCutter ? order.estadoCorte : order.estadoCostura;
      const myCommissionFlag = isCutter ? order.comisionCorte : order.comisionCostura;
      const unitRate = getEffectiveUnitRate(order, isCutter ? 'corte' : 'costura', worker);
      const batchTotal = order.cantidad * unitRate;

      const isLockedByCut = !isCutter && myStatus === 'bloqueado_corte';
      const isReturned = myStatus === 'devuelto';

      // Para Sueldo + Comisión: mostrar comisión si ya está marcada como comisión O si ya superó su meta semanal
      const quotaAlreadyMet = isHybrid && earnings && (earnings.totalWeekApprovedPieces >= earnings.quota);

      return `

                  <div>
                    <span class="block text-[10px] uppercase text-purple-300 font-bold">★ Lote en Comisión</span>
                    <span class="font-mono-num font-bold text-zinc-200 text-xs">${formatMXN(unitRate)} / pza extra</span>
                  </div>
                  <div class="text-right">
                    <span class="block text-[10px] uppercase text-purple-300">Comisión del lote</span>
                    <span class="font-mono-num font-extrabold text-purple-300 text-base">+${formatMXN(batchTotal)}</span>
                  </div>
                </div>

                <div class="mb-4 px-3 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 flex items-center justify-between text-xs">
                  <span class="text-zinc-400"><i class="fa-solid fa-shield-check text-sky-400 mr-1.5"></i>Cubierta por sueldo base</span>
                  <span class="text-zinc-500">Meta semanal</span>

                <i class="fa-solid fa-lock"></i>

              </button>

    // ============================================================================
    // PANEL DE ADMINISTRACIÓN / CALIDAD
    // ============================================================================
    function renderAdminDashboard(adminUser) {
      const pendingQualityOrders = state.orders.filter(
        o => o.estadoCorte === 'en_calidad' || o.estadoCostura === 'en_calidad'
      );
      const approvedQualityOrders = state.orders.filter(
        o => o.estadoGeneral === 'completado'
      );
      const activeOrders = state.orders.filter(
        o => o.estadoGeneral !== 'completado'
      );

      let tabContent = '';
      if (state.activeTab === 'calidad') {
        tabContent = renderAdminQualityTab(pendingQualityOrders);
      } else if (state.activeTab === 'aprobados_calidad') {
        tabContent = renderAdminApprovedQualityTab(approvedQualityOrders);
      } else if (state.activeTab === 'prendas') {
        tabContent = renderAdminGarmentsTab();
      } else if (state.activeTab === 'empleados') {
        tabContent = renderAdminEmployeesTab();
      } else if (state.activeTab === 'pagos') {
        tabContent = renderAdminPayoutsTab();
      } else {
        tabContent = renderAdminOrdersTab(activeOrders, approvedQualityOrders.length);
      }

      return `
        <!-- KPIs superiores -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
          <div onclick="setTab('ordenes')" class="cursor-pointer bg-zinc-900 hover:bg-zinc-900/80 border border-zinc-800 rounded-2xl p-4 transition">
            <span class="text-xs font-semibold text-zinc-400">Órdenes Activas</span>
            <div class="text-2xl font-extrabold text-white font-mono-num mt-1">${activeOrders.length}</div>
            <span class="text-[11px] text-amber-400">En corte, costura o devolución</span>
          </div>

          <div onclick="setTab('calidad')" class="cursor-pointer bg-zinc-900 hover:bg-zinc-900/80 border ${pendingQualityOrders.length > 0 ? 'border-sky-500/50' : 'border-zinc-800'} rounded-2xl p-4 transition">
            <span class="text-xs font-semibold text-zinc-400">Por Revisar Calidad</span>
            <div class="text-2xl font-extrabold text-sky-400 font-mono-num mt-1">${pendingQualityOrders.length}</div>
            <span class="text-[11px] text-zinc-400">Lotes listos para aprobar/regresar</span>
          </div>

          <div onclick="setTab('aprobados_calidad')" class="cursor-pointer bg-zinc-900 hover:bg-zinc-900/80 border border-emerald-500/30 rounded-2xl p-4 transition">
            <span class="text-xs font-semibold text-emerald-300">✓ Aprobados en Calidad</span>
            <div class="text-2xl font-extrabold text-emerald-400 font-mono-num mt-1">${approvedQualityOrders.length}</div>

    function renderAdminOrderCard(order) {
      const garment = getGarmentById(order.garmentId) || {
        nombre: 'Prenda',
        imagen: createGarmentSVG('Prenda', '#27272a', '#f59e0b', 'hoodie'),
        especificaciones: ''
      };
      const cutter = order.cortadorId ? getUserById(order.cortadorId) : null;
      const sewer = order.costureroId ? getUserById(order.costureroId) : null;

      const corteBadge =
        order.estadoCorte === 'no_aplica' ? `<span class="px-2 py-0.5 rounded bg-zinc-800 text-zinc-500 text-[11px]">No aplica</span>` :
        order.estadoCorte === 'aprobado' ? `<span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[11px] font-bold">✓ Corte aprobado</span>` :
        order.estadoCorte === 'en_calidad' ? `<span class="px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 text-[11px] font-bold">✓ Ya está cortado (En Calidad)</span>` :
        order.estadoCorte === 'devuelto' ? `<span class="px-2 py-0.5 rounded bg-red-500/20 text-red-300 text-[11px] font-bold">↺ Devuelto a Corte</span>` :
        `<span class="px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 text-[11px] font-semibold">Cortando...</span>`;

      const costuraBadge =
        order.estadoCostura === 'no_aplica' ? `<span class="px-2 py-0.5 rounded bg-zinc-800 text-zinc-500 text-[11px]">No aplica</span>` :
        order.estadoCostura === 'aprobado' ? `<span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[11px] font-bold">✓ Ya está cosido y aprobado</span>` :
        order.estadoCostura === 'en_calidad' ? `<span class="px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 text-[11px] font-bold">✓ Ya está cosido (En Calidad)</span>` :
        order.estadoCostura === 'bloqueado_corte' ? `<span class="px-2 py-0.5 rounded bg-zinc-800 text-zinc-400 text-[11px]">Esperando corte</span>` :
        order.estadoCostura === 'devuelto' ? `<span class="px-2 py-0.5 rounded bg-red-500/20 text-red-300 text-[11px] font-bold">↺ Devuelto a Costura</span>` :
        `<span class="px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 text-[11px] font-semibold">Cosiendo...</span>`;

      return `
        <div class="bg-zinc-900 border ${order.urgencia === 'urgente' ? 'border-amber-500/50' : 'border-zinc-800'} rounded-2xl p-4 sm:p-5 flex flex-col justify-between gap-4">
          <div>
            <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">
              <div class="flex items-center gap-2">
                <span class="font-mono-num font-bold text-sm px-2.5 py-0.5 rounded-lg bg-zinc-800 text-white">${order.folio}</span>
                <span class="px-2 py-0.5 rounded-lg text-[11px] font-semibold bg-zinc-950 text-zinc-300 border border-zinc-800">
                  ${order.flujo === 'secuencial' ? 'Corte → Costura' : order.flujo === 'solo_corte' ? 'Solo Corte' : 'Solo Costura'}
                </span>
                ${order.urgencia === 'urgente'
                  ? `<span class="px-2 py-0.5 rounded-lg text-[11px] font-bold bg-red-500/20 text-red-300 border border-red-500/30"><i class="fa-solid fa-fire mr-1"></i>URGENTE</span>`
                  : ''
                }
              </div>
              <span class="font-mono-num font-extrabold text-sm text-amber-300">${order.cantidad} PIEZAS</span>
            </div>

            <!-- Cabecera de prenda y especificaciones -->
            <div class="flex gap-3.5 items-start mb-3">
              <img src="${garment.imagen}" onclick="openImageViewer('${garment.imagen}', '${garment.nombre}')"
                class="w-16 h-16 rounded-xl object-cover border border-zinc-700 cursor-zoom-in shrink-0" />
              <div class="min-w-0 flex-1">
                <h3 class="font-bold text-white text-sm sm:text-base truncate">${garment.nombre}</h3>
                <p class="text-xs text-zinc-400 line-clamp-2 mt-0.5">${garment.especificaciones || ''}</p>
                ${order.notasExtra ? `<p class="text-xs text-amber-200/90 mt-1"><strong>Nota:</strong> ${order.notasExtra}</p>` : ''}
              </div>
            </div>

            <!-- Responsables y estados por etapa -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
              ${cutter ? `
                <div class="p-3 rounded-xl bg-zinc-950 border border-zinc-800">
                  <div class="flex items-center justify-between gap-1 mb-1">
                    <span class="text-zinc-400">Corte: <strong class="text-zinc-200">${cutter.nombre.split(' ')[0]}</strong></span>
                    ${corteBadge}
                  </div>
                  ${cutter.esquemaPago === 'sueldo_comision' ? `
                    <button onclick="toggleOrderCommissionFlag('${order.id}', 'corte')"
                      class="mt-1.5 w-full py-1 px-2 rounded-lg text-[11px] font-bold border transition ${
                        order.comisionCorte
                          ? 'bg-purple-500/20 text-purple-200 border-purple-500/40'
                          : 'bg-zinc-900 text-zinc-400 border-zinc-700 hover:text-white'
                      }">
                      ${order.comisionCorte ? '★ Cuenta como COMISIÓN' : '● Base Sueldo (Clic → Comisión)'}
                    </button>
                  ` : ''}
                </div>
              ` : ''}

              ${sewer ? `
                <div class="p-3 rounded-xl bg-zinc-950 border border-zinc-800">
                  <div class="flex items-center justify-between gap-1 mb-1">
                    <span class="text-zinc-400">Costura: <strong class="text-zinc-200">${sewer.nombre.split(' ')[0]}</strong></span>
                    ${costuraBadge}
                  </div>
                  ${sewer.esquemaPago === 'sueldo_comision' ? `
                    <button onclick="toggleOrderCommissionFlag('${order.id}', 'costura')"
                      class="mt-1.5 w-full py-1 px-2 rounded-lg text-[11px] font-bold border transition ${
                        order.comisionCostura
                          ? 'bg-purple-500/20 text-purple-200 border-purple-500/40'
                          : 'bg-zinc-900 text-zinc-400 border-zinc-700 hover:text-white'
                      }">
                      ${order.comisionCostura ? '★ Cuenta como COMISIÓN' : '● Base Sueldo (Clic → Comisión)'}
                    </button>
                  ` : ''}
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function renderAdminQualityTab(pendingOrders) {
      return `
        <div class="mb-4">
          <h2 class="text-lg font-bold text-white">Revisión de Calidad</h2>
          <p class="text-xs text-zinc-400">Aprueba los lotes bien hechos o regrésalos con motivo y foto para corrección.</p>
        </div>

        ${pendingOrders.length === 0 ? `
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-10 text-center text-zinc-400 text-sm">
            No hay lotes pendientes de revisión de calidad en este momento.
          </div>
        ` : `
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            ${pendingOrders.map(order => {
              const garment = getGarmentById(order.garmentId) || { nombre: 'Prenda', imagen: '' };
              const stageToReview = order.estadoCostura === 'en_calidad' ? 'costura' : 'corte';
              const workerId = stageToReview === 'corte' ? order.cortadorId : order.costureroId;
              const worker = getUserById(workerId);
              const isHybrid = worker && worker.esquemaPago === 'sueldo_comision';
              const earnings = worker ? calculateWorkerEarnings(worker.id) : null;
              const autoCommission = isHybrid && earnings && (earnings.totalWeekApprovedPieces + order.cantidad >= earnings.quota);
              const currentFlag = stageToReview === 'corte' ? order.comisionCorte : order.comisionCostura;
              const defaultChecked = currentFlag || autoCommission;

              return `
                <div class="bg-zinc-900 border border-sky-500/40 rounded-2xl p-5 flex flex-col justify-between gap-4">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-3">
                      <span class="font-mono-num font-bold text-sm px-2.5 py-0.5 rounded-lg bg-zinc-800 text-white">${order.folio}</span>
                    <span class="px-2.5 py-0.5 rounded-lg bg-sky-500/20 text-sky-300 text-xs font-bold uppercase">
                      Etapa: ${stageToReview} • ${order.cantidad} pzas
                    </span>
                  </div>
                  <div class="text-[11px] text-zinc-400 font-mono-num mb-3">
                    Terminado en ${stageToReview}: ${stageToReview === 'costura' ? (order.fechaCosturaTerminado || order.fechaCreacion) : (order.fechaCorteTerminado || order.fechaCreacion)}
                  </div>

                    <div class="flex gap-3.5 items-center mb-3">
                      <img src="${garment.imagen}" onclick="openImageViewer('${garment.imagen}', '${garment.nombre}')"
                        class="w-16 h-16 rounded-xl object-cover border border-zinc-700 cursor-zoom-in" />
                      <div>
                        <h3 class="font-bold text-white text-base">${garment.nombre}</h3>
                        <p class="text-xs text-zinc-400">Trabajador: <strong class="text-zinc-200">${worker ? worker.nombre : 'Sin asignar'}</strong></p>
                      </div>
                    </div>

                    ${isHybrid ? `
                      <label class="flex items-center gap-2.5 p-3 rounded-xl bg-purple-950/35 border border-purple-500/35 cursor-pointer text-xs text-purple-200 mb-2">
                        <input id="comm-check-${order.id}-${stageToReview}" type="checkbox" ${defaultChecked ? 'checked' : ''}
                          class="w-4 h-4 rounded accent-purple-500" />
                        <span>
                          <strong>Contar este lote como COMISIÓN</strong>
                          ${autoCommission ? ' (Meta semanal alcanzada/superada)' : ' (Aplica extra al sueldo base)'}
                        </span>
                      </label>
                    ` : ''}
                  </div>

                  <div class="flex gap-2.5 pt-3 border-t border-zinc-800">
                    <button onclick="openRejectModal('${order.id}', '${stageToReview}')"
                      class="flex-1 py-2.5 px-3 rounded-xl bg-red-600/20 hover:bg-red-600/30 text-red-300 border border-red-500/40 font-bold text-xs sm:text-sm transition flex items-center justify-center gap-1.5">
                      <i class="fa-solid fa-rotate-left"></i> Regresar / Corregir
                    </button>
                    <button onclick="approveStage('${order.id}', '${stageToReview}')"
                      class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-extrabold text-xs sm:text-sm transition flex items-center justify-center gap-1.5">
                      <i class="fa-solid fa-check"></i> Aprobar Lote
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

            </form>
          </div>

          <div class="lg:col-span-7 space-y-3">
            <h2 class="text-base font-bold text-white">Usuarios Registrados</h2>
            ${state.users.map(u => {
              const isInactive = u.activo === false;
              const isWorker = u.rol === 'cortador' || u.rol === 'costurero';
              return `
                <div class="bg-zinc-900 border ${isInactive ? 'border-red-900/50 opacity-70' : 'border-zinc-800'} rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="font-bold text-sm text-white">${u.nombre}</span>
                      <span class="px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 text-[11px] font-semibold">${getRoleLabel(u.rol)}</span>
                      ${isInactive
                        ? `<span class="px-2 py-0.5 rounded bg-red-500/20 text-red-300 text-[11px] font-bold">● DADO DE BAJA</span>`
                        : `<span class="px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300 text-[11px] font-semibold">● Activo</span>`
                      }
                    </div>
                    <div class="text-xs text-zinc-400 font-mono-num mt-1">
                      Usuario: <strong class="text-zinc-200">${u.usuario}</strong> • Clave: <strong class="text-zinc-200">${u.password}</strong>
                    </div>
                    ${isWorker ? `
                      <div class="flex items-center gap-2 flex-wrap mt-2">
                        <button onclick="cycleWorkerPayScheme('${u.id}')"
                          class="px-2.5 py-1 rounded-lg bg-zinc-950 hover:bg-zinc-800 border border-zinc-700 text-[11px] font-semibold text-amber-300 transition">
                          ${getPaySchemeLabel(u)} (Cambiar)
                        </button>
                        ${(u.esquemaPago === 'sueldo' || u.esquemaPago === 'sueldo_comision') ? `
                          <label class="text-[11px] text-sky-300 flex items-center gap-1">
                            Sueldo $:
                            <input type="number" step="10" min="0" value="${u.sueldoBase || 0}" onchange="updateWorkerSalary('${u.id}', this.value)"
                              class="w-20 px-2 py-0.5 rounded bg-zinc-950 border border-zinc-700 text-white font-mono-num text-xs" />
                          </label>
                        ` : ''}
                        ${u.esquemaPago === 'sueldo_comision' ? `
                          <label class="text-[11px] text-zinc-400 flex items-center gap-1">
                            Meta:
                            <input type="number" min="1" value="${u.metaSemanal || 25}" onchange="updateWorkerQuota('${u.id}', this.value)"
                              class="w-16 px-2 py-0.5 rounded bg-zinc-950 border border-zinc-700 text-white font-mono-num text-xs" />
                          </label>
                        ` : ''}
                      </div>
                    ` : ''}
                  </div>

                  <div class="flex items-center gap-2 self-end sm:self-center">
                    ${u.id !== state.currentUserId ? `
                      <button onclick="toggleUserActiveStatus('${u.id}')"
                        class="px-3 py-2 rounded-xl text-xs font-bold border transition ${
                          isInactive
                            ? 'bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border-emerald-500/30'
                            : 'bg-red-500/15 hover:bg-red-500/25 text-red-300 border-red-500/30'
                        }">
                        <i class="fa-solid ${isInactive ? 'fa-user-check' : 'fa-user-slash'} mr-1"></i>
                        ${isInactive ? 'Reactivar' : 'Dar de baja'}
                      </button>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderAdminPayoutsTab() {
      const workers = state.users.filter(u => u.rol === 'cortador' || u.rol === 'costurero');

      return `
        <div class="mb-4">
          <h2 class="text-lg font-bold text-white">Cortes de Pago, Sueldos y Envío a Finanzas</h2>
          <p class="text-xs text-zinc-400">Revisa lo aprobado y el sueldo correspondiente, y envíalo directamente a Finanzas para que ejecute y marque como pagado.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
          ${workers.map(w => {
            const calc = calculateWorkerEarnings(w.id);
            const isHybrid = w.esquemaPago === 'sueldo_comision';
            const isSalaryOnly = w.esquemaPago === 'sueldo';
            const sueldoBase = Number(w.sueldoBase) || 0;
            const totalToSend = isSalaryOnly ? sueldoBase : isHybrid ? sueldoBase + calc.approvedAmount : calc.approvedAmount;
            const canSend = totalToSend > 0 || calc.approvedPieces > 0;
            return `
              <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 flex flex-col justify-between gap-4">
                <div>
                  <div class="flex items-center justify-between gap-2">
                    <div>
                      <h3 class="font-bold text-white text-base">${w.nombre}</h3>
                      <span class="text-xs text-zinc-400">${getRoleLabel(w.rol)} • ${getPaySchemeLabel(w)}</span>
                    </div>
                    <span class="font-mono-num font-extrabold text-xl text-emerald-400">${formatMXN(totalToSend)}</span>
                  </div>
                  <div class="mt-3 text-xs text-zinc-300 bg-zinc-950 p-3 rounded-xl border border-zinc-800 space-y-1">
                    ${isSalaryOnly ? `
                      <div class="flex justify-between"><span>Sueldo fijo:</span><strong class="text-sky-300 font-mono-num">${formatMXN(sueldoBase)}</strong></div>
                    ` : isHybrid ? `
                      <div class="flex justify-between"><span>Sueldo base:</span><strong class="text-sky-300 font-mono-num">${formatMXN(sueldoBase)}</strong></div>
                      <div class="flex justify-between"><span>Comisiones (${calc.commissionPieces} pzas):</span><strong class="text-purple-300 font-mono-num">${formatMXN(calc.approvedAmount)}</strong></div>
                    ` : `
                      <div class="flex justify-between"><span>Piezas aprobadas:</span><strong>${calc.approvedPieces}</strong></div>
                      <div class="flex justify-between"><span>En calidad:</span><strong>${calc.pendingPieces} pzas</strong></div>
                    `}
                  </div>
                </div>
                <button onclick="sendWorkerPayoutToFinance('${w.id}')" ${!canSend ? 'disabled' : ''}
                  class="w-full py-2.5 px-4 rounded-xl ${
                    canSend
                      ? 'bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-extrabold'
                      : 'bg-zinc-800 text-zinc-500 font-semibold cursor-not-allowed'
                  } text-xs sm:text-sm transition">
                  <i class="fa-solid fa-paper-plane mr-1.5"></i> Marcar y Enviar a Finanzas
                </button>
              </div>
            `;
          }).join('')}
        </div>

        ${state.financeQueue.length > 0 ? `
          <div class="mb-8">
            <h3 class="text-sm font-extrabold uppercase tracking-wider text-purple-700 mb-3">Enviados a Finanzas (Pendientes de pagar)</h3>
            <div class="space-y-2.5">
              ${state.financeQueue.map(fq => `
                <div class="p-4 rounded-2xl bg-purple-50 border border-purple-300 shadow-sm flex items-center justify-between gap-3">
                  <div>
                    <div class="font-bold text-sm text-zinc-950">${fq.workerName} <span class="text-xs font-medium text-zinc-600">(${fq.rol})</span></div>
                    <div class="text-xs text-zinc-700 mt-0.5">${fq.concepto} • <strong>${fq.piezas} pzas</strong></div>
                  </div>
                  <div class="font-mono-num font-extrabold text-base sm:text-lg text-purple-700 shrink-0">${formatMXN(fq.monto)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <div>
          <h3 class="text-sm font-bold uppercase tracking-wider text-zinc-400 mb-3">Historial de Pagos Confirmados por Finanzas</h3>
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl divide-y divide-zinc-800">
            ${state.payoutHistory.map(p => `
              <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                <div>
                  <strong class="text-white text-sm">${p.workerName}</strong>
                  <span class="text-zinc-400 ml-2">${p.concepto} • ${p.piezas} pzas</span>
                  <div class="text-[11px] text-zinc-500 mt-0.5">${p.fecha} • Pagó: ${p.pagadoPor}</div>
                </div>
                <div class="font-mono-num font-bold text-emerald-400 text-sm">${formatMXN(p.monto)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ============================================================================
    // PANEL DE FINANZAS
    // ============================================================================
    function setFinanceFilter(key, value) {
      financeFilters[key] = value;
      render();
    }

    function renderFinanceDashboard(financeUser) {
      const totalQueueToPay = state.financeQueue.reduce((acc, item) => acc + (Number(item.monto) || 0), 0);
      const workersForFilter = state.users.filter(u => u.rol === 'cortador' || u.rol === 'costurero');

      // Meses disponibles en el historial + mes actual
      const monthSet = new Set([getCurrentMonthKey(), '2026-11']);
      state.payoutHistory.forEach(p => {
        if (p.mesClave) monthSet.add(p.mesClave);
        else if (p.fechaISO && p.fechaISO.length >= 7) monthSet.add(p.fechaISO.slice(0, 7));
      });
      const availableMonths = Array.from(monthSet).sort().reverse();

      const filteredHistory = state.payoutHistory.filter(p => {
        const pMonth = p.mesClave || (p.fechaISO ? p.fechaISO.slice(0, 7) : '2026-11');
        const matchesMonth = financeFilters.monthKey === 'todos' || pMonth === financeFilters.monthKey;
        const matchesWorker = financeFilters.workerId === 'todos' ||
          p.workerId === financeFilters.workerId ||
          (p.workerName && workersForFilter.some(w => w.id === financeFilters.workerId && w.nombre === p.workerName));
        return matchesMonth && matchesWorker;
      });

      const filteredTotalPaid = filteredHistory.reduce((acc, p) => acc + (Number(p.monto) || 0), 0);
      const filteredTotalPieces = filteredHistory.reduce((acc, p) => acc + (Number(p.piezas) || 0), 0);
      const selectedWorkerObj = workersForFilter.find(w => w.id === financeFilters.workerId);

      // Resumen agrupado por mes para vista de calendario mensual
      const monthSummaryMap = {};
      state.payoutHistory.forEach(p => {
        const mKey = p.mesClave || (p.fechaISO ? p.fechaISO.slice(0, 7) : '2026-11');
        if (!monthSummaryMap[mKey]) {
          monthSummaryMap[mKey] = { monthKey: mKey, total: 0, count: 0 };
        }
        monthSummaryMap[mKey].total += Number(p.monto) || 0;
        monthSummaryMap[mKey].count += 1;
      });
      const monthlySummaries = Object.values(monthSummaryMap).sort((a, b) => b.monthKey.localeCompare(a.monthKey));

      return `
        <div class="bg-gradient-to-r from-emerald-950/60 via-zinc-900 to-zinc-900 border border-emerald-500/30 rounded-2xl p-5 mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-300">Total enviado por Administración por pagar</span>
            <div class="text-3xl font-extrabold text-white font-mono-num mt-1">${formatMXN(totalQueueToPay)}</div>
            <p class="text-xs text-zinc-400 mt-0.5">${state.financeQueue.length} ${state.financeQueue.length === 1 ? 'corte pendiente' : 'cortes pendientes'} de confirmar pago</p>
          </div>
          <div class="bg-zinc-950/80 border border-zinc-800 rounded-xl p-3 text-right">
            <span class="text-[10px] uppercase tracking-wider text-zinc-400 block">Suma pagada (${financeFilters.monthKey === 'todos' ? 'Todos los meses' : formatMonthLabel(financeFilters.monthKey)})</span>
            <span class="text-xl font-extrabold text-emerald-400 font-mono-num">${formatMXN(filteredTotalPaid)}</span>
            <span class="text-[11px] text-zinc-400 block">${selectedWorkerObj ? selectedWorkerObj.nombre : 'Todos los empleados'} • ${filteredTotalPieces} pzas</span>
          </div>
        </div>

        <h2 class="text-lg font-bold text-white mb-3">Cortes Pendientes de Pago</h2>
        ${state.financeQueue.length === 0 ? `
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 text-center text-zinc-400 text-sm mb-8">
            No hay cortes pendientes por pagar en este momento.
          </div>
        ` : `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            ${state.financeQueue.map(item => `
              <div class="bg-zinc-900 border border-emerald-500/40 rounded-2xl p-5 flex flex-col justify-between gap-4">
                <div>
                  <div class="flex items-center justify-between gap-2">
                    <div>
                      <h3 class="font-bold text-white text-base">${item.workerName}</h3>
                      <span class="text-xs text-zinc-400">${item.rol} • Enviado por ${item.enviadoPor} (${item.fechaEnvio || ''})</span>
                    </div>
                    <span class="font-mono-num font-extrabold text-xl text-emerald-400">${formatMXN(item.monto)}</span>
                  </div>
                  <p class="text-xs text-zinc-300 mt-3 bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                    ${item.concepto} • <strong>${item.piezas} piezas</strong>
                  </p>
                </div>
                <button onclick="confirmFinancePayment('${item.id}')"
                  class="w-full py-3 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-extrabold text-xs sm:text-sm transition flex items-center justify-center gap-2">
                  <i class="fa-solid fa-money-check-dollar"></i> Marcar como Pagado
                </button>
              </div>
            `).join('')}
          </div>
        `}

        <!-- Filtros de Calendario / Mes y Empleado para Aclaraciones -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-5 mb-4">
          <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 mb-4">
            <div>
              <h3 class="text-base font-bold text-white"><i class="fa-solid fa-calendar-days text-emerald-400 mr-2"></i>Control Mensual y Consulta por Empleado</h3>
              <p class="text-xs text-zinc-400">Filtra por mes o empleado para revisar fechas, piezas y sumas pagadas ante cualquier aclaración.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-2.5">
              <div>
                <label class="block text-[10px] font-bold uppercase text-zinc-400 mb-1">Empleado</label>
                <select onchange="setFinanceFilter('workerId', this.value)"
                  class="px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-xs text-white font-semibold focus:outline-none focus:border-emerald-500">
                  <option value="todos" ${financeFilters.workerId === 'todos' ? 'selected' : ''}>Todos los empleados</option>
                  ${workersForFilter.map(w => `
                    <option value="${w.id}" ${financeFilters.workerId === w.id ? 'selected' : ''}>${w.nombre} (${getRoleLabel(w.rol)})</option>
                  `).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-bold uppercase text-zinc-400 mb-1">Mes (Calendario)</label>
                <input type="month" value="${financeFilters.monthKey === 'todos' ? '' : financeFilters.monthKey}"
                  onchange="setFinanceFilter('monthKey', this.value || 'todos')"
                  class="px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-xs text-white font-mono-num focus:outline-none focus:border-emerald-500" />
              </div>
              <div class="flex items-end">
                <button onclick="setFinanceFilter('monthKey', 'todos')"
                  class="px-3 py-2 rounded-xl border text-xs font-bold transition ${
                    financeFilters.monthKey === 'todos'
                      ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                      : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border-zinc-700'
                  }">
                  Todos los meses
                </button>
              </div>
            </div>
          </div>

          <!-- Atajos de meses registrados -->
          <div class="flex items-center gap-2 flex-wrap mb-4">
            ${availableMonths.map(mKey => {
              const active = financeFilters.monthKey === mKey;
              return `
                <button onclick="setFinanceFilter('monthKey', '${mKey}')"
                  class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${
                    active
                      ? 'bg-emerald-500 text-zinc-950 border-emerald-400 font-bold'
                      : 'bg-zinc-950 text-zinc-300 border-zinc-800 hover:border-zinc-700'
                  }">
                  <i class="fa-regular fa-calendar mr-1"></i>${formatMonthLabel(mKey)}
                </button>
              `;
            }).join('')}
          </div>

          <!-- Lista filtrada con fechas -->
          ${filteredHistory.length === 0 ? `
            <div class="p-6 rounded-xl bg-zinc-950 border border-zinc-800 text-center text-xs text-zinc-500">
              No hay pagos registrados para el filtro seleccionado.
            </div>
          ` : `
            <div class="divide-y divide-zinc-800 rounded-xl bg-zinc-950 border border-zinc-800 overflow-hidden">
              ${filteredHistory.map(p => `
                <div class="p-3.5 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                  <div>
                    <div class="flex items-center gap-2 flex-wrap">
                      <strong class="text-white text-sm">${p.workerName}</strong>
                      <span class="px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 text-[10px] font-semibold">${p.rol}</span>
                      <span class="text-[11px] text-emerald-300 font-mono-num"><i class="fa-regular fa-clock mr-1"></i>${p.fecha}</span>
                    </div>
                    <div class="text-zinc-400 mt-1">${p.concepto} • <strong>${p.piezas} piezas</strong></div>
                  </div>
                  <div class="font-mono-num font-bold text-emerald-400 text-sm sm:text-base">${formatMXN(p.monto)}</div>
                </div>
              `).join('')}
            </div>
          `}

          <!-- Suma total del filtro actual -->
          <div class="mt-4 p-4 rounded-xl bg-emerald-950/35 border border-emerald-500/35 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div class="text-xs text-emerald-200">
              <strong>Suma total pagada</strong> ${selectedWorkerObj ? `a <strong>${selectedWorkerObj.nombre}</strong>` : 'del equipo'}
              ${financeFilters.monthKey !== 'todos' ? `en <strong>${formatMonthLabel(financeFilters.monthKey)}</strong>` : '(histórico completo)'}
              • <strong>${filteredTotalPieces} piezas</strong>
            </div>
            <div class="font-mono-num font-extrabold text-xl text-emerald-400">${formatMXN(filteredTotalPaid)}</div>
          </div>
        </div>

        <!-- Resumen rápido por mes -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-5">
          <h4 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-3">Resumen por Mes</h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            ${monthlySummaries.map(ms => `
              <button onclick="setFinanceFilter('monthKey', '${ms.monthKey}')"
                class="p-3.5 rounded-xl bg-zinc-950 hover:bg-zinc-800/80 border border-zinc-800 text-left transition flex items-center justify-between">
                <div>
                  <div class="text-xs font-bold text-white">${formatMonthLabel(ms.monthKey)}</div>
                  <div class="text-[11px] text-zinc-500">${ms.count} ${ms.count === 1 ? 'pago' : 'pagos'}</div>
                </div>
                <div class="font-mono-num font-extrabold text-sm text-emerald-400">${formatMXN(ms.total)}</div>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ============================================================================
    // RENDERIZADO PRINCIPAL DE LA APLICACIÓN
    // ============================================================================
    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      const user = getCurrentUser();
      if (!user || user.activo === false) {
        state.currentUserId = null;
        appEl.innerHTML = renderLoginScreen();
        return;
      }

      const pendingQualityCount = state.orders.filter(
        o => o.estadoCorte === 'en_calidad' || o.estadoCostura === 'en_calidad'
      ).length;

      let navItems = [];
      if (user.rol === 'admin') {
        navItems = [
          { id: 'ordenes', label: 'Órdenes y Flujo', icon: 'fa-layer-group' },
          { id: 'calidad', label: `Calidad (${pendingQualityCount})`, icon: 'fa-shield-halved' },
          { id: 'prendas', label: 'Prendas y Tarifas', icon: 'fa-shirt' },
          { id: 'empleados', label: 'Empleados / Accesos', icon: 'fa-users-gear' },
          { id: 'pagos', label: 'Cortes y Finanzas', icon: 'fa-sack-dollar' }
        ];
      } else if (user.rol === 'finanzas') {
        navItems = [
          { id: 'cola_finanzas', label: `Por Pagar (${state.financeQueue.length})`, icon: 'fa-money-check-dollar' }
        ];
      } else {
        navItems = [
          { id: 'mis_tareas', label: 'Mis Órdenes', icon: 'fa-clipboard-list' }
        ];
        if (user.esquemaPago === 'pieza' || user.esquemaPago === 'sueldo_comision') {
          navItems.push({
            id: 'mi_pago',
            label: user.esquemaPago === 'sueldo_comision' ? 'Meta y Comisiones' : 'Mi Pago Acumulado',
            icon: 'fa-coins'
          });
        }
      }

      let bodyContent = '';
      if (user.rol === 'admin') {
        bodyContent = renderAdminDashboard(user);
      } else if (user.rol === 'finanzas') {
        bodyContent = renderFinanceDashboard(user);
      } else {
        bodyContent = renderWorkerDashboard(user);
      }

      appEl.innerHTML = `
        <header class="sticky top-0 z-30 glass-panel border-b border-zinc-200">
          <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="min-w-0">
                <div class="flex items-center gap-2.5">
                  <span class="font-black text-lg sm:text-xl text-zinc-950 tracking-tighter uppercase leading-none">
                    DARE<span class="text-orange-600">CORE</span>
                  </span>
                  <span class="text-[11px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-md bg-zinc-950 text-white">
                    TALLER
                  </span>
                  <span class="hidden sm:inline-block px-2.5 py-0.5 rounded-full bg-orange-600/10 text-orange-700 text-[11px] font-bold">
                    ${getRoleLabel(user.rol)}
                  </span>
                </div>
                <p class="text-[11px] text-zinc-500 truncate mt-0.5">${user.nombre} (@${user.usuario})</p>
              </div>
            </div>

            <button onclick="logout()"
              class="px-3.5 py-2 rounded-xl bg-zinc-950 hover:bg-zinc-800 text-white text-xs font-bold transition flex items-center gap-1.5 shrink-0">
              <i class="fa-solid fa-right-from-bracket"></i> Salir
            </button>
          </div>

          <div class="max-w-6xl mx-auto px-4 pb-2.5 flex items-center gap-2 overflow-x-auto">
            ${navItems.map(item => {
              const active = state.activeTab === item.id;
              return `
                <button onclick="setTab('${item.id}')"
                  class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-2 ${
                    active
                      ? 'bg-orange-600 text-white shadow-sm'
                      : 'bg-zinc-100 text-zinc-700 hover:text-zinc-950 hover:bg-zinc-200/80'
                  }">
                  <i class="fa-solid ${item.icon}"></i>
                  <span>${item.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        </header>

        <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6">
          ${bodyContent}
        </main>

        ${user.rol === 'admin' ? renderModals() : ''}
      `;
    }

    // Inicializar al cargar la ventana
    window.onload = function () {
      render();
      if (typeof window.initDarecoreRealtimeSync === 'function') {
        window.initDarecoreRealtimeSync();
      }
    };
  </script>

  <!-- SINCRONIZACIÓN EN TIEMPO REAL CON FIREBASE REALTIME DATABASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA2DGjsW7Jm75UDOYTqFAWgnzeKapuZS4g",
      authDomain: "darecore-taller.firebaseapp.com",
      databaseURL: "https://darecore-taller-default-rtdb.firebaseio.com",
      projectId: "darecore-taller",
      storageBucket: "darecore-taller.firebasestorage.app",
      messagingSenderId: "13434205730",
      appId: "1:13434205730:web:3bf61c11a66c14ba2dbc7b",
      measurementId: "G-KPZ46PQF0C"
    };

    const app = initializeApp(firebaseConfig);
    try {
      getAnalytics(app);
    } catch (e) {
      // Analytics opcional en entornos sin cookies o bloqueadores
    }

    const db = getDatabase(app);
    const rtdbPath = typeof RTDB_STATE_PATH === 'string' && RTDB_STATE_PATH
      ? RTDB_STATE_PATH
      : 'darecore_taller/shared_state';
    const sharedRef = ref(db, rtdbPath);
    let syncInitialized = false;

    window.pushSharedStateToFirebase = async function (payload) {
      try {
        await set(sharedRef, payload);
      } catch (err) {
        console.error('Error al guardar en Firebase Realtime Database:', err);
        showToast('No se pudo sincronizar con Firebase. Revisa reglas de Realtime Database.', 'error');
      }
    };

    window.initDarecoreRealtimeSync = function () {
      if (syncInitialized) return;
      syncInitialized = true;

      onValue(sharedRef, (snapshot) => {
        try {
          if (!snapshot.exists()) {
            // Si aún no hay datos en la nube, subir el estado inicial una sola vez
            set(sharedRef, getSharedStatePayload(state));
            return;
          }

          const remoteData = snapshot.val() || {};
          isRemoteApplying = true;

          state.users = Array.isArray(remoteData.users) ? remoteData.users : state.users;
          state.garments = Array.isArray(remoteData.garments) ? remoteData.garments : state.garments;
          state.orders = Array.isArray(remoteData.orders) ? remoteData.orders : state.orders;
          state.financeQueue = Array.isArray(remoteData.financeQueue) ? remoteData.financeQueue : [];
          state.payoutHistory = Array.isArray(remoteData.payoutHistory) ? remoteData.payoutHistory : state.payoutHistory;

          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          render();
        } catch (err) {
          console.error('Error al aplicar actualización en tiempo real:', err);
        } finally {
          isRemoteApplying = false;
        }
      }, (error) => {
        console.error('Error en listener de Realtime Database:', error);
      });
    };

    if (document.readyState === 'complete') {
      window.initDarecoreRealtimeSync();
    }
  </script>
</body>
